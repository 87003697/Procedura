[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "procedura-octree-mapping"
version = "0.1.0"
description = "Shadow-only multiscale unbalanced-OT validation for occupied octrees"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.1",
]

[project.scripts]
procedura-octree-map = "octree_mapping.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["octree_mapping*"]
